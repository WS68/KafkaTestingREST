name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Check formatting
        run: npm run format:check
      - name: Run unit and contract tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm run audit:ci

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    env:
      KAFKA_TESTING_REST_CLUSTER: ${{ vars.KAFKA_TESTING_REST_CLUSTER || 'localhost:9092' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # При отсутствии доступного брокера интеграционные тесты сами пропускаются.
      - name: Run integration tests
        run: npm run test:integration
